<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>回声观测 · 悬疑文字探险</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #05070c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', monospace;
            padding: 12px;
        }

        /* 手机外壳 */
        .phone {
            max-width: 400px;
            width: 100%;
            height: 700px;
            background: #101218;
            border-radius: 44px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.6), 0 0 0 6px #262a36, 0 0 0 10px #181c26;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 动态岛区域 */
        .status-bar {
            padding: 12px 20px 6px 20px;
            background: #101218;
            color: #dadce9;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
        }

        /* 主内容滚动区 */
        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            background: radial-gradient(circle at 20% 20%, #131724, #080b12);
            scroll-behavior: smooth;
        }

        /* 故事卡片 */
        .story-card {
            background: rgba(16, 18, 28, 0.82);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 22px 18px;
            margin-bottom: 20px;
            border: 0.5px solid rgba(210, 180, 240, 0.2);
            box-shadow: 0 10px 24px rgba(0,0,0,0.4);
        }

        .story-text {
            color: #f0edff;
            font-size: 17px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            text-shadow: 0 1px 2px black;
        }

        /* 线索卡片 */
        .clue-card {
            background: #1e192b;
            border-left: 4px solid #c06eb0;
            padding: 12px 16px;
            margin: 18px 0 10px 0;
            border-radius: 18px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #e2c5ff;
        }

        /* 选项按钮区 */
        .options-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }

        .option-btn {
            background: rgba(28, 30, 45, 0.96);
            border: 1px solid #6f5590;
            border-radius: 60px;
            padding: 14px 20px;
            color: #f3ecfe;
            font-size: 16px;
            font-weight: 500;
            text-align: left;
            transition: 0.1s linear;
            cursor: pointer;
            font-family: inherit;
            backdrop-filter: blur(2px);
        }

        .option-btn:active {
            background: #362a50;
            transform: scale(0.97);
            border-color: #b777e0;
        }

        /* 密码面板 */
        .puzzle-panel {
            background: #0b0a14cc;
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 18px;
            margin: 16px 0 8px 0;
            border: 1px solid #57437a;
        }

        .puzzle-input-group {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .puzzle-input-group input {
            background: #000000aa;
            border: 1px solid #aa85d4;
            padding: 12px 16px;
            border-radius: 44px;
            color: white;
            font-size: 22px;
            text-align: center;
            width: 150px;
            font-family: monospace;
            letter-spacing: 3px;
        }

        .puzzle-submit {
            background: #6b4790;
            border: none;
            padding: 12px 24px;
            border-radius: 44px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .bottom-bar {
            background: #0b0d14cc;
            backdrop-filter: blur(20px);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            border-top: 0.5px solid #312c42;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ccc0f0;
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
        }

        .icon-btn:active {
            background: #26213b;
        }

        .ending-tag {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #00000055;
            border-radius: 40px;
            color: #fbc490;
            font-weight: bold;
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: #1e1a2b;
        }
        .screen::-webkit-scrollbar-thumb {
            background: #9f7bcb;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="phone" id="gamePhone">
    <div class="status-bar">
        <span id="liveTime">9:41</span>
        <span>📶 🔋 84%</span>
    </div>
    <div class="screen" id="gameScreen">
        <div class="story-card">
            <div class="story-text" id="storyText">初始化界面中...</div>
            <div id="extraClueArea"></div>
            <div class="options-area" id="optionsContainer"></div>
        </div>
    </div>
    <div class="bottom-bar">
        <button class="icon-btn" id="resetBtn">⟳ 重启</button>
        <button class="icon-btn" id="soundToggleBtn">🔊 氛围音</button>
        <span style="font-size:11px; color:#7a6c9a;">[ 观测记录 ]</span>
    </div>
</div>

<script>
    // ---------- 极简音效 / 微恐氛围音 (用户交互后启用) ----------
    let audioAllowed = false;
    let audioCtx = null;
    let bgGain = null;
    let bgNoiseNode = null;
    let isSoundOn = false;       // 用户是否开启背景音
    let lfoOsc = null;

    // 初始化 AudioContext (需手势)
    function initAudioContext() {
        if (audioCtx) return audioCtx;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            bgGain = audioCtx.createGain();
            bgGain.gain.value = 0;
            bgGain.connect(audioCtx.destination);
            return audioCtx;
        } catch(e) {
            console.warn("Web Audio API not supported");
            return null;
        }
    }

    // 启动幽暗背景噪音 + 低频嗡鸣 (微恐)
    function startAmbient() {
        if (!audioCtx || !isSoundOn || bgNoiseNode) return;
        // 噪音处理器
        const bufferSize = 4096;
        const noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
        noiseNode.onaudioprocess = (e) => {
            const output = e.outputBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = (Math.random() * 2 - 1) * 0.2;
            }
        };
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 380;
        filter.Q.value = 1.5;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.16;
        noiseNode.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(bgGain);
        bgNoiseNode = noiseNode;
        
        // 低频压迫振荡器
        const lfo = audioCtx.createOscillator();
        lfo.type = "sine";
        lfo.frequency.value = 1.1;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 0.045;
        lfo.connect(lfoGain);
        lfoGain.connect(bgGain);
        lfo.start();
        lfoOsc = lfo;
        
        bgGain.gain.setTargetAtTime(0.28, audioCtx.currentTime, 0.8);
    }

    function stopAmbient() {
        if (bgGain) bgGain.gain.value = 0;
        if (bgNoiseNode) {
            try { bgNoiseNode.disconnect(); } catch(e) {}
            bgNoiseNode = null;
        }
        if (lfoOsc) {
            try { lfoOsc.stop(); } catch(e) {}
            lfoOsc = null;
        }
    }

    // 短促点击音效
    function playTapSound() {
        if (!audioCtx || !isSoundOn || !audioAllowed) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.value = 960;
            gain.gain.value = 0.09;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
            osc.stop(audioCtx.currentTime + 0.35);
        } catch(e) {}
    }

    // 惊悚提示音 (微恐触发)
    function playDreadNote() {
        if (!audioCtx || !isSoundOn || !audioAllowed) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.value = 300;
            gain.gain.value = 0.14;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.0);
            osc.stop(audioCtx.currentTime + 0.9);
            
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = "sawtooth";
            osc2.frequency.value = 510;
            gain2.gain.value = 0.08;
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start();
            osc2.stop(audioCtx.currentTime + 0.7);
        } catch(e) {}
    }

    // 启用音频（用户首次触摸）
    function enableAudioByUser() {
        if (audioAllowed) return;
        const ctx = initAudioContext();
        if (ctx && ctx.state === "suspended") {
            ctx.resume().then(() => {
                audioAllowed = true;
                if (isSoundOn) {
                    startAmbient();
                }
                updateSoundButtonUI();
            }).catch(e => console.log);
        } else if (ctx) {
            audioAllowed = true;
            if (isSoundOn) startAmbient();
            updateSoundButtonUI();
        }
    }

    function toggleBackgroundSound() {
        if (!audioAllowed) {
            enableAudioByUser();
            // 等启用后再切状态
            setTimeout(() => {
                if (audioAllowed) {
                    isSoundOn = !isSoundOn;
                    if (isSoundOn) startAmbient();
                    else stopAmbient();
                    updateSoundButtonUI();
                }
            }, 50);
            return;
        }
        isSoundOn = !isSoundOn;
        if (isSoundOn) {
            startAmbient();
            playTapSound();
        } else {
            stopAmbient();
        }
        updateSoundButtonUI();
    }

    function updateSoundButtonUI() {
        const btn = document.getElementById("soundToggleBtn");
        if (btn) {
            if (isSoundOn && audioAllowed) btn.innerText = "🎧 氛围音开";
            else if (!isSoundOn) btn.innerText = "🔇 氛围音关";
            else btn.innerText = "🎵 点我启用";
        }
    }

    // ---------- 游戏核心 ----------
    let currentSceneId = "start";
    let globalPuzzleFlag = false;   // 是否已解开密码

    const scenes = {
        start: {
            desc: "📱 你从旧货摊买回一台无名手机。\n深夜，屏幕突然亮起神秘消息：「终于有人拿起我了……观测已经开始。她就在镜子里。」\n桌面出现一个叫『回声观测』的APP，无法删除。",
            options: [
                { text: "📲 打开「回声观测」", next: "appOpen", act: () => playTapSound() },
                { text: "📴 尝试强制关机", next: "badEnd_shut", act: () => playDreadNote() }
            ]
        },
        appOpen: {
            desc: "📡 监控画面：一座废弃疗养院，走廊尽头写着B6。屏幕上闪现文字：「日记藏在档案柜，密码是她的祭日时刻——月日时分。找到它，否则你将在循环中腐朽。」\n手机里遗留一张老照片，背面数字「1428」若隐若现。",
            options: [
                { text: "🔍 检查档案柜 (获得线索)", next: "diaryClue", act: () => playTapSound() },
                { text: "🏚️ 直接前往疗养院B6", next: "badEnd_rush", act: () => playDreadNote() }
            ]
        },
        diaryClue: {
            desc: "📔 残破日记: 「她生于1月4日2时8分，那天镜屋最安静。守护密码是她完整的降生时刻。我将秘密藏在了数字里……」\n你记下「1428」。空气中突然传来低语:“记住它，否则会迷失。”",
            options: [
                { text: "🚪 前往疗养院电梯口", next: "elevatorScene", act: () => playTapSound() },
                { text: "📱 再次翻查日记本", next: "diaryClue", act: () => playTapSound() }
            ],
            extra: "<div class='clue-card'>📌 关键线索：数字 1428 (月日时分的暗码)</div>"
        },
        elevatorScene: {
            desc: "🏚️ 废楼大厅，电梯面板只有B1-B5，但墙面有人血涂鸦的「B6」。电梯门自动敞开，碎裂镜面映出你的身后站着一个模糊影子。\n🕹️ 电子锁响起广播:「请输入权限代码...」",
            options: [
                { text: "🔢 输入密码 (解开B6)", next: "passwordGate", act: () => playTapSound() },
                { text: "😨 试图走楼梯逃离", next: "badEnd_stairs", act: () => playDreadNote() }
            ]
        },
        passwordGate: {
            desc: "⌨️ 蓝色光屏闪烁，提示——「她的时辰是唯一的钥匙。你从日记里看到了什么？」",
            isPuzzle: true,
            options: [
                { text: "⬅️ 返回电梯口", next: "elevatorScene", act: () => playTapSound() }
            ]
        },
        afterCorrect: {
            desc: "🔓 密码正确！B6层门开启。走廊两侧挂满了你的照片，日期全是未来的某一天。\n手机收到新消息：「把日记最后一页投进焚烧炉，结束观测。」\n前方两条路: 左转档案室，右转礼拜堂。",
            options: [
                { text: "📂 左转 · 档案室", next: "archiveEnding", act: () => playTapSound() },
                { text: "⛪ 右转 · 礼拜堂", next: "chapelEnding", act: () => playTapSound() }
            ]
        },
        afterWrong: {
            desc: "⚠️ 密码错误！警报尖锐响起，所有镜子淌出黑水，无数影子将你拖入镜中世界。\n你的脸凝固在镜面里，成为新的观测傀儡。",
            options: [
                { text: "💀 结局·镜中囚笼 (重新开始)", next: "resetGame", act: () => playDreadNote() }
            ],
            isEnding: true
        },
        archiveEnding: {
            desc: "📂 档案室火盆依旧燃烧。你将日记最后一页丢进火焰，瞬间所有镜面碎裂，白光刺目。\n醒来后你躺在二手市场摊位上，手机变成一块废铁。但手腕上多了一道时钟刻痕，你知道——观测已经终结。",
            options: [
                { text: "✨ 结局 · 时钟烙印 (生还)", next: "resetGame", act: () => playTapSound() }
            ],
            isEnding: true
        },
        chapelEnding: {
            desc: "⛪ 礼拜堂内传来童谣，座机响起。接听后是你自己的声音:「取代我的位置，成为永恒观测者吧。」拒绝后穹顶崩塌，你永远被困在这层幻境，成为下一个「管理员」。",
            options: [
                { text: "🕯️ 结局 · 永夜观测者", next: "resetGame", act: () => playDreadNote() }
            ],
            isEnding: true
        },
        badEnd_shut: {
            desc: "📵 强行关机后手机再次亮起，屏幕一片血迹，苍白的指尖从屏幕伸出。房间温度骤降，你再也没有醒来。",
            options: [
                { text: "⚰️ 结局 · 拒绝的代价", next: "resetGame", act: () => playDreadNote() }
            ],
            isEnding: true
        },
        badEnd_rush: {
            desc: "🏚️ 未解密码就闯入B6，地板塌陷跌入深坑。黑暗中回荡低语:「密码是保护，而愚昧是深渊。」",
            options: [
                { text: "🕳️ 结局 · 盲目坠渊", next: "resetGame", act: () => playDreadNote() }
            ],
            isEnding: true
        },
        badEnd_stairs: {
            desc: "🚨 楼梯无尽循环，每一层都写着B6。手机电量耗尽，惨叫被黑暗吞噬。",
            options: [
                { text: "🌀 结局 · 无尽回廊", next: "resetGame", act: () => playDreadNote() }
            ],
            isEnding: true
        },
        resetGame: {
            desc: "🔄 「观测重启，记忆清除」\n手机闪过最后一行字，一切重置。",
            options: [
                { text: "🌟 重新开始探索", next: "start", act: () => { globalPuzzleFlag = false; playTapSound(); } }
            ]
        }
    };

    // 渲染界面
    function renderScene(sceneId) {
        const scene = scenes[sceneId];
        if (!scene) {
            renderScene("start");
            return;
        }
        const storyDiv = document.getElementById("storyText");
        const optionsDiv = document.getElementById("optionsContainer");
        const extraDiv = document.getElementById("extraClueArea");
        extraDiv.innerHTML = "";
        
        storyDiv.innerHTML = scene.desc.replace(/\n/g, '<br>');
        
        // 额外线索卡
        if (scene.extra) {
            extraDiv.innerHTML = scene.extra;
        }
        
        // 处理谜题模式
        if (scene.isPuzzle && sceneId === "passwordGate") {
            const puzzleHtml = `
                <div class="puzzle-panel">
                    <div class="puzzle-input-group">
                        <input type="text" id="pwdInput" placeholder="4位数字" maxlength="4" inputmode="numeric">
                        <button class="puzzle-submit" id="pwdSubmit">验证</button>
                    </div>
                    <div style="font-size:13px; color:#cfaee6;">💡 从日记回忆: 月/日/时/分 => 四位数字</div>
                </div>
            `;
            extraDiv.insertAdjacentHTML('beforeend', puzzleHtml);
            const submitBtn = document.getElementById("pwdSubmit");
            const inputField = document.getElementById("pwdInput");
            if (submitBtn) {
                submitBtn.onclick = () => {
                    playTapSound();
                    const val = inputField.value.trim();
                    if (val === "1428") {
                        globalPuzzleFlag = true;
                        renderScene("afterCorrect");
                    } else {
                        globalPuzzleFlag = false;
                        renderScene("afterWrong");
                    }
                };
            }
            if (inputField) {
                inputField.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") submitBtn.click();
                });
            }
        }
        
        // 绘制选项按钮（非谜题场景的标准选项 或者 谜题场景的额外返回选项）
        optionsDiv.innerHTML = "";
        if (scene.options) {
            for (let opt of scene.options) {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    if (opt.act) opt.act();
                    let nextId = opt.next;
                    if (nextId === "resetGame") {
                        globalPuzzleFlag = false;
                    }
                    if (nextId === "start") globalPuzzleFlag = false;
                    renderScene(nextId);
                    // 滚动到最底部
                    const screenEl = document.getElementById("gameScreen");
                    setTimeout(() => screenEl.scrollTop = screenEl.scrollHeight, 20);
                };
                optionsDiv.appendChild(btn);
            }
        }
        
        // 如果结局额外显示效果
        if (scene.isEnding) {
            const endDiv = document.createElement("div");
            endDiv.className = "ending-tag";
            endDiv.innerText = "✧ 结局达成 ✧";
            optionsDiv.appendChild(endDiv);
        }
        
        // 小ARG贴士：某些场景动态显示隐藏线索
        if (sceneId === "diaryClue") {
            const metaMsg = document.createElement("div");
            metaMsg.className = "clue-card";
            metaMsg.innerHTML = "📟 镜面倒影: ʇɥƃᴉɹ ʇou ɹoɹɹᴉɯ ǝɥʇ uᴉ ɥʇnɹʇ";
            extraDiv.appendChild(metaMsg);
        }
        if (sceneId === "elevatorScene" && !globalPuzzleFlag) {
            const whisper = document.createElement("div");
            whisper.className = "clue-card";
            whisper.innerHTML = "⚠️ 电梯镜面闪过诡异的笑容，但身后无人…… ⚠️";
            extraDiv.appendChild(whisper);
        }
    }
    
    function resetEntireGame() {
        globalPuzzleFlag = false;
        renderScene("start");
        playTapSound();
        const screenDiv = document.getElementById("gameScreen");
        if (screenDiv) screenDiv.scrollTop = 0;
    }
    
    // 更新时间UI
    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        const timeStr = `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}`;
        const timeSpan = document.getElementById("liveTime");
        if (timeSpan) timeSpan.innerText = timeStr;
    }
    
    // 绑定UI事件
    document.getElementById("resetBtn").addEventListener("click", () => {
        resetEntireGame();
        if (!audioAllowed) enableAudioByUser();
        else playTapSound();
    });
    document.getElementById("soundToggleBtn").addEventListener("click", () => {
        if (!audioAllowed) {
            enableAudioByUser();
            setTimeout(() => {
                if (audioAllowed) {
                    isSoundOn = true;
                    startAmbient();
                    updateSoundButtonUI();
                }
            }, 30);
        } else {
            toggleBackgroundSound();
        }
    });
    
    // 全局触摸启用音频（适配手机）
    const phoneContainer = document.getElementById("gamePhone");
    phoneContainer.addEventListener("touchstart", () => {
        if (!audioAllowed) enableAudioByUser();
    }, { passive: true });
    phoneContainer.addEventListener("click", () => {
        if (!audioAllowed) enableAudioByUser();
    });
    
    // 启动游戏
    updateClock();
    setInterval(updateClock, 1000);
    renderScene("start");
    
    // 控制台ARG小彩蛋
    console.log("%c⚠️ 你发现了观测者密文: 密码序列是月日时分的数字 1428", "color:#bb9eff; font-size:13px");
</script>
</body>
</html>
