<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>回声档案 · 观测者 | 悬疑ARG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #020408;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', 'SF Mono', monospace;
            padding: 12px;
        }

        /* 手机外壳 */
        .phone {
            max-width: 420px;
            width: 100%;
            height: 760px;
            background: #0a0c14;
            border-radius: 44px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.6), 0 0 0 6px #2a2e3c, 0 0 0 10px #181c24;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            padding: 12px 20px 6px;
            background: #0a0c14;
            color: #bccef0;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid #2f2b3a;
        }

        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #03050b;
            scroll-behavior: smooth;
        }

        /* 动态UI卡片 */
        .ui-panel {
            background: rgba(10, 12, 25, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #3c2f5a;
            transition: all 0.2s;
        }

        .ui-header {
            font-size: 18px;
            font-weight: bold;
            color: #bd9eff;
            border-bottom: 2px solid #5f4790;
            padding-bottom: 8px;
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .story-text {
            color: #e2e6ff;
            font-size: 16px;
            line-height: 1.45;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        /* 监控专用样式 */
        .cam-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .cam {
            background: #000000aa;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            border: 1px solid #5a4a7a;
            font-size: 12px;
            color: #8fcdff;
        }
        .cam .title {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .cam .preview {
            background: #001020;
            height: 70px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            color: #6f9eff;
        }

        /* 终端/电脑样式 */
        .terminal {
            background: #010a14;
            border-radius: 20px;
            padding: 14px;
            font-family: monospace;
            border: 1px solid #00ccaa40;
        }
        .terminal-line {
            color: #9effcf;
            margin-bottom: 12px;
        }
        .search-area {
            margin: 20px 0 12px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .search-box input {
            flex: 1;
            background: #000000cc;
            border: 1px solid #b277e6;
            border-radius: 60px;
            padding: 12px 18px;
            color: white;
            font-size: 15px;
            font-family: monospace;
            outline: none;
        }
        .search-box button {
            background: #4e3a6e;
            border: none;
            border-radius: 40px;
            padding: 0 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .search-hint {
            font-size: 12px;
            color: #8f90b0;
            margin-top: 8px;
        }

        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }
        .opt-btn {
            background: #1e1c30;
            border: 1px solid #8a6bcb;
            border-radius: 60px;
            padding: 12px 18px;
            color: #f0ebff;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            transition: 0.05s linear;
        }
        .opt-btn:active {
            background: #3a2c5a;
            transform: scale(0.97);
        }

        .inventory {
            background: #0b0d18aa;
            border-radius: 20px;
            padding: 8px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #b5a5e0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .bottom-bar {
            background: #070912cc;
            backdrop-filter: blur(20px);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #342f4a;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #cbbaff;
            font-size: 16px;
            padding: 8px;
            cursor: pointer;
        }

        .glow-text {
            color: #ffb56b;
            text-shadow: 0 0 3px red;
        }
        hr {
            border-color: #3c2a60;
            margin: 12px 0;
        }
    </style>
</head>
<body>
<div class="phone" id="app">
    <div class="status-bar">
        <span id="timeLive">23:19</span>
        <span>📡 加密连接 ███ 82%</span>
    </div>
    <div class="screen" id="screen">
        <div id="inventoryArea" class="inventory">📦 线索/道具: 无</div>
        <div id="dynamicUI" class="ui-panel">
            <!-- 动态内容 -->
        </div>
    </div>
    <div class="bottom-bar">
        <button class="icon-btn" id="resetGameBtn">⟳ 重启调查</button>
        <button class="icon-btn" id="audioToggleBtn">🎧 氛围音</button>
        <span style="font-size:11px;">[ OBSERVER ]</span>
    </div>
</div>

<script>
    // ========== 音频 (轻量氛围) ==========
    let audioCtx = null;
    let isAudioOn = false;
    let audioAllowed = false;
    let bgGain = null;
    let noiseGen = null;
    
    function initAudio() {
        if (audioCtx) return audioCtx;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            bgGain = audioCtx.createGain();
            bgGain.gain.value = 0;
            bgGain.connect(audioCtx.destination);
            return audioCtx;
        } catch(e) { return null; }
    }
    
    function startAmbience() {
        if (!audioCtx || !isAudioOn || noiseGen) return;
        const bufferSize = 4096;
        const script = audioCtx.createScriptProcessor(bufferSize, 1, 1);
        script.onaudioprocess = (e) => {
            const out = e.outputBuffer.getChannelData(0);
            for (let i=0; i<bufferSize; i++) out[i] = (Math.random()*2-1)*0.18;
        };
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 400;
        const gainN = audioCtx.createGain();
        gainN.gain.value = 0.12;
        script.connect(filter);
        filter.connect(gainN);
        gainN.connect(bgGain);
        noiseGen = script;
        
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = 0.9;
        const gainO = audioCtx.createGain();
        gainO.gain.value = 0.03;
        osc.connect(gainO);
        gainO.connect(bgGain);
        osc.start();
        bgGain.gain.setTargetAtTime(0.22, audioCtx.currentTime, 0.5);
        window._ambOsc = osc;
    }
    
    function stopAmbience() {
        if (bgGain) bgGain.gain.value = 0;
        if (noiseGen) { try { noiseGen.disconnect(); } catch(e){} noiseGen=null; }
        if (window._ambOsc) { try { window._ambOsc.stop(); } catch(e){} }
    }
    
    function playBeep() {
        if (!audioCtx || !isAudioOn || !audioAllowed) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 1100;
        gain.gain.value = 0.07;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.2);
        osc.stop(audioCtx.currentTime+0.18);
    }
    
    function playDread() {
        if (!audioCtx || !isAudioOn || !audioAllowed) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = 310;
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+1.2);
        osc.stop(audioCtx.currentTime+1);
    }
    
    function enableAudio() {
        if (audioAllowed) return;
        const ctx = initAudio();
        if (ctx && ctx.state === "suspended") {
            ctx.resume().then(()=>{
                audioAllowed = true;
                if (isAudioOn) startAmbience();
                updateAudioUI();
            });
        } else if(ctx) {
            audioAllowed = true;
            if (isAudioOn) startAmbience();
            updateAudioUI();
        }
    }
    
    function toggleAudio() {
        if (!audioAllowed) {
            enableAudio();
            setTimeout(()=>{ if(audioAllowed) { isAudioOn=true; startAmbience(); updateAudioUI(); } }, 30);
            return;
        }
        isAudioOn = !isAudioOn;
        if (isAudioOn) startAmbience();
        else stopAmbience();
        updateAudioUI();
        if(isAudioOn) playBeep();
    }
    
    function updateAudioUI() {
        const btn = document.getElementById("audioToggleBtn");
        if(btn) btn.innerText = isAudioOn ? "🎧 氛围音开" : "🔇 氛围音关";
    }
    
    // ========== 游戏状态 ==========
    let currentState = "monitor";   // monitor, terminal, phone, final_choice
    let inventory = [];   // 存储线索字符串
    let discoveredClues = {
        name: false,
        date: false,
        mirror: false,
        ritual: false
    };
    let gameStage = 0;  // 0:监控室, 1:终端解锁, 2:手机取证, 3:结局分支
    
    // 辅助更新背包UI
    function updateInventoryUI() {
        const invDiv = document.getElementById("inventoryArea");
        if(inventory.length===0) invDiv.innerHTML = "📦 线索/道具: 无";
        else invDiv.innerHTML = "📦 线索/道具: " + inventory.join(" · ");
    }
    
    function addClue(clue) {
        if(!inventory.includes(clue)) {
            inventory.push(clue);
            updateInventoryUI();
        }
    }
    
    // 根据不同界面模式渲染UI
    function renderUI() {
        const container = document.getElementById("dynamicUI");
        if (!container) return;
        let html = "";
        
        if (currentState === "monitor") {
            html = `
                <div class="ui-header">📹 监控回放系统 [ 旧城区废弃公寓 - 2024.03.15 ]</div>
                <div class="story-text">⚠️ 警方委托：调查林薇失踪案。最后监控显示她进入公寓后未离开。你需要检索特定时间段的录像，输入关键词调取片段。</div>
                <div class="cam-grid">
                    <div class="cam"><div class="title">CAM 04 (楼道)</div><div class="preview">[静态画面]</div></div>
                    <div class="cam"><div class="title">CAM 07 (电梯)</div><div class="preview">[雪花噪点]</div></div>
                </div>
                <div class="search-area">
                    <div class="terminal-line">> 检索关键词 (如: 时间/人名/物品)</div>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="输入关键词...">
                        <button id="searchBtn">🔍 检索</button>
                    </div>
                    <div class="search-hint">💡 试试 "林薇" / "03-15 23:00" / "镜子" / "行李箱"</div>
                </div>
                <div id="monitorFeedback" class="story-text" style="color:#acd5ff; margin-top:12px;"></div>
            `;
        } 
        else if (currentState === "terminal") {
            html = `
                <div class="ui-header">💻 警用数据库终端 [ 加密档案 ]</div>
                <div class="terminal">
                    <div class="terminal-line">C:\\Users\\Observer> 接入档案系统...</div>
                    <div class="terminal-line">> 权限: 调查员级   |  关键词搜索历史</div>
                </div>
                <div class="story-text">数据库包含失踪人员、历史案件、神秘学档案。输入特定名词以关联记录。</div>
                <div class="search-area">
                    <div class="search-box">
                        <input type="text" id="dbSearchInput" placeholder="输入查询...">
                        <button id="dbSearchBtn">🔎 查询</button>
                    </div>
                    <div class="search-hint">📌 可能的关键词: "林薇", "1994", "慈恩疗养院", "镜子仪式"</div>
                </div>
                <div id="terminalFeedback" class="story-text" style="color:#bdffae;"></div>
            `;
        }
        else if (currentState === "phone") {
            html = `
                <div class="ui-header">📱 受害者手机取证 [ 已锁定 - 需线索解锁 ]</div>
                <div class="story-text">手机设有密码提示：「她最深的恐惧」。你需要输入正确的密码短语或搜索相关短信内容。</div>
                <div class="search-area">
                    <div class="search-box">
                        <input type="text" id="phoneInput" placeholder="输入密码/关键词...">
                        <button id="phoneBtn">🔓 尝试解锁</button>
                    </div>
                    <div class="search-hint">💡 结合之前的线索：名字、年份、仪式相关。</div>
                </div>
                <div id="phoneFeedback" class="story-text" style="color:#ffcf9a;"></div>
            `;
        }
        else if (currentState === "final_choice") {
            html = `
                <div class="ui-header">⚠️ 最终观测室 [ 镜像回廊 ]</div>
                <div class="story-text">集齐所有真相后，你面对镜中的她。她低语：“选择你的结局”。</div>
                <div class="option-buttons" id="finalOptions"></div>
            `;
        }
        
        container.innerHTML = html;
        
        // 绑定事件
        if (currentState === "monitor") {
            const btn = document.getElementById("searchBtn");
            const inp = document.getElementById("searchInput");
            if(btn) btn.onclick = () => handleMonitorSearch(inp.value.trim());
        } else if (currentState === "terminal") {
            const btn = document.getElementById("dbSearchBtn");
            const inp = document.getElementById("dbSearchInput");
            if(btn) btn.onclick = () => handleTerminalSearch(inp.value.trim());
        } else if (currentState === "phone") {
            const btn = document.getElementById("phoneBtn");
            const inp = document.getElementById("phoneInput");
            if(btn) btn.onclick = () => handlePhoneSearch(inp.value.trim());
        } else if (currentState === "final_choice") {
            const finalDiv = document.getElementById("finalOptions");
            if(finalDiv) {
                finalDiv.innerHTML = `
                    <button class="opt-btn" id="endGood">🕯️ 打破镜子 · 解放她</button>
                    <button class="opt-btn" id="endDark">🖤 接受观测 · 取代她</button>
                    <button class="opt-btn" id="endEscape">🚪 逃离公寓 · 遗忘一切</button>
                `;
                document.getElementById("endGood")?.addEventListener("click", ()=>endGame("good"));
                document.getElementById("endDark")?.addEventListener("click", ()=>endGame("dark"));
                document.getElementById("endEscape")?.addEventListener("click", ()=>endGame("escape"));
            }
        }
    }
    
    // 监控室搜索处理
    function handleMonitorSearch(keyword) {
        const feedback = document.getElementById("monitorFeedback");
        if(!feedback) return;
        const kw = keyword.toLowerCase();
        if(kw.includes("林薇") || kw.includes("linwei")) {
            feedback.innerHTML = "📹 [片段已定位] 03-15 23:14: 林薇进入公寓406室，之后画面出现短暂干扰，一道人影闪过镜子。获得线索【林薇的最后身影】";
            addClue("林薇的最后身影");
            discoveredClues.name = true;
            playBeep();
            // 解锁下一步提示
            if(discoveredClues.name && !gameStage) { gameStage = 1; feedback.innerHTML += "<br>🔓 监控系统提示: 更多信息需接入警用数据库终端。点击右下角'切换界面'。"; }
            return;
        }
        if(kw.includes("23:00") || kw.includes("23:14") || kw.includes("时间")) {
            feedback.innerHTML = "📹 时间轴标记: 23:14 电梯监控拍到林薇拿着一个旧镜子。镜面反光出现诡异符号。获得【镜子符号照片】";
            addClue("镜子符号照片");
            playBeep();
            return;
        }
        if(kw.includes("镜子")) {
            feedback.innerHTML = "📹 406室门口监控: 林薇反复照镜子，镜中倒影似乎多了一个人形。线索【镜像异常】";
            addClue("镜像异常");
            playBeep();
            return;
        }
        feedback.innerHTML = "❌ 未检索到相关记录。试试: '林薇', '镜子', '23:14' 等。";
        playDread();
    }
    
    // 数据库终端搜索
    function handleTerminalSearch(keyword) {
        const fb = document.getElementById("terminalFeedback");
        if(!fb) return;
        const kw = keyword.toLowerCase();
        if(kw.includes("慈恩疗养院") || kw.includes("疗养院")) {
            fb.innerHTML = "📄 [档案] 慈恩疗养院1994年失踪案: 病人林某在镜子室失踪，至今未解。关联词: '镜子仪式'。获得【旧案件档案】";
            addClue("旧案件档案");
            playBeep();
            return;
        }
        if(kw.includes("1994")) {
            fb.innerHTML = "📅 1994年7月29日，慈恩疗养院报告一名叫林薇的患者在B6层隔离室消失。院方记录提到 '观测实验'。获得【疗养院记录】";
            addClue("疗养院记录");
            playBeep();
            return;
        }
        if(kw.includes("镜子仪式")) {
            fb.innerHTML = "🔮 神秘学档案: '镜子仪式' 可以将人的灵魂困于镜中，需要三样信物: 旧照片, 怀表, 日记残页。林薇的遗物中曾出现过这些。获得【仪式解密】";
            addClue("仪式解密");
            discoveredClues.ritual = true;
            playBeep();
            if(discoveredClues.ritual && gameStage===1) { gameStage = 2; fb.innerHTML += "<br>✅ 数据库已解锁手机取证模块。点击'切换界面'继续。";}
            return;
        }
        if(kw.includes("林薇")) {
            fb.innerHTML = "👤 林薇，1994年失踪案关键人物。与慈恩疗养院强相关。建议查询'慈恩疗养院'。";
            playBeep();
            return;
        }
        fb.innerHTML = "未找到匹配档案。关键词提示: '慈恩疗养院', '1994', '镜子仪式'";
        playDread();
    }
    
    // 手机取证搜索
    function handlePhoneSearch(keyword) {
        const fb = document.getElementById("phoneFeedback");
        if(!fb) return;
        const kw = keyword.toLowerCase();
        if(kw.includes("林薇") || kw.includes("linwei")) {
            fb.innerHTML = "📱 手机备忘录: '镜子里的她叫我的名字。必须找到三样东西: 旧照片, 怀表, 日记残页。' 获得【林薇遗言】";
            addClue("林薇遗言");
            playBeep();
            return;
        }
        if(kw.includes("19940729") || kw.includes("0729") || kw.includes("生日")) {
            fb.innerHTML = "🔓 密码正确！手机解锁。短信记录: '7月29日，来B6找我。' 同时发现一张地图标注了公寓地下室镜子室。获得【地下室地图】";
            addClue("地下室地图");
            playBeep();
            if(inventory.includes("地下室地图") && inventory.includes("仪式解密") && inventory.includes("林薇的最后身影")) {
                fb.innerHTML += "<br>✨ 所有关键线索集齐！你可以前往最终观测室。点击下方'前往结局'按钮。";
                // 显示最终按钮
                const extraBtn = document.createElement("button");
                extraBtn.className = "opt-btn";
                extraBtn.innerText = "🪞 前往镜像回廊 (最终章)";
                extraBtn.onclick = () => { currentState = "final_choice"; renderUI(); };
                document.getElementById("phoneFeedback")?.parentElement?.appendChild(extraBtn);
            }
            return;
        }
        fb.innerHTML = "解锁失败。提示: 可能需要日期或名字。试试 '林薇' 或 '19940729' 。";
        playDread();
    }
    
    function endGame(type) {
        let endingMsg = "";
        if(type === "good") {
            endingMsg = "✨ 真结局 · 破镜救赎 ✨\n你打破镜子，林薇的魂魄得以安息。公寓恢复平静，你手腕多了一道银痕作为观测者的印记。";
            addClue("★ 真结局达成");
        } else if(type === "dark") {
            endingMsg = "🖤 结局 · 永恒观测者 🖤\n你自愿取代林薇，成为镜中新的存在。公寓406室的镜子从此多了一个倒影。";
            addClue("★ 黑暗结局");
        } else {
            endingMsg = "🏃 结局 · 遗忘逃亡 🏃\n你逃离公寓，但夜夜噩梦，永远无法摆脱镜中低语。";
            addClue("★ 逃离结局");
        }
        const container = document.getElementById("dynamicUI");
        container.innerHTML = `
            <div class="ui-header">🔮 观测终结</div>
            <div class="story-text" style="white-space:pre-wrap;">${endingMsg}</div>
            <div class="option-buttons"><button class="opt-btn" id="restartEnd">🔄 重新开始调查</button></div>
        `;
        document.getElementById("restartEnd")?.addEventListener("click", ()=> fullReset());
        if(isAudioOn) playDread();
    }
    
    function fullReset() {
        inventory = [];
        discoveredClues = { name: false, date: false, mirror: false, ritual: false };
        gameStage = 0;
        currentState = "monitor";
        updateInventoryUI();
        renderUI();
        playBeep();
    }
    
    // 界面切换按钮
    function addNavButtons() {
        const container = document.getElementById("dynamicUI");
        if(!container) return;
        const navDiv = document.createElement("div");
        navDiv.style.display = "flex";
        navDiv.style.gap = "12px";
        navDiv.style.marginTop = "20px";
        navDiv.style.justifyContent = "space-between";
        if(currentState === "monitor") {
            navDiv.innerHTML = `<button class="opt-btn" id="gotoTerminal" style="flex:1;">🖥️ 切换至数据库终端</button>`;
            document.getElementById("gotoTerminal")?.addEventListener("click", () => {
                if(discoveredClues.name) { currentState = "terminal"; renderUI(); addNavButtons(); }
                else alert("尚未解锁终端权限，请在监控中找到关键线索(林薇)后再试。");
            });
        } else if(currentState === "terminal") {
            navDiv.innerHTML = `<button class="opt-btn" id="gotoPhone" style="flex:1;">📱 切换至手机取证</button>`;
            document.getElementById("gotoPhone")?.addEventListener("click", () => {
                if(discoveredClues.ritual) { currentState = "phone"; renderUI(); addNavButtons(); }
                else alert("需要先在数据库查询'镜子仪式'解锁手机取证模块。");
            });
        } else if(currentState === "phone") {
            navDiv.innerHTML = `<button class="opt-btn" id="backTerminal" style="flex:1;">⬅️ 返回数据库</button>`;
            document.getElementById("backTerminal")?.addEventListener("click", () => { currentState = "terminal"; renderUI(); addNavButtons(); });
        }
        if(currentState !== "final_choice") container.appendChild(navDiv);
    }
    
    // 全局更新
    function updateTime() {
        const now = new Date();
        document.getElementById("timeLive").innerText = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    }
    setInterval(updateTime, 1000);
    updateTime();
    
    // 首次渲染
    fullReset();
    
    // 监听全局触摸启用音频
    document.getElementById("app").addEventListener("touchstart", ()=>enableAudio(), {once:true, passive:true});
    document.getElementById("resetGameBtn").addEventListener("click", ()=>{ fullReset(); playBeep(); });
    document.getElementById("audioToggleBtn").addEventListener("click", toggleAudio);
    
    // 重写renderUI使其包含导航按钮
    const origRender = renderUI;
    renderUI = function() {
        origRender();
        addNavButtons();
    };
    renderUI();
</script>
</body>
</html>
