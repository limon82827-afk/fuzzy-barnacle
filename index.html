<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>深渊观测·残响 | 长篇悬疑文字游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #010105;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'Courier New', monospace;
            padding: 12px;
        }

        /* 手机外壳 */
        .phone {
            max-width: 400px;
            width: 100%;
            height: 720px;
            background: #0e1018;
            border-radius: 44px;
            box-shadow: 0 30px 45px rgba(0,0,0,0.7), 0 0 0 6px #262a38, 0 0 0 10px #191d28;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            padding: 12px 20px 6px 20px;
            background: #0e1018;
            color: #dbdef0;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
        }

        .screen {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px;
            background: radial-gradient(circle at 25% 20%, #131725, #070a12);
            scroll-behavior: smooth;
        }

        .story-card {
            background: rgba(14, 16, 26, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 22px 18px;
            margin-bottom: 20px;
            border: 0.5px solid rgba(180, 140, 220, 0.3);
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
        }

        .story-text {
            color: #f2edff;
            font-size: 17px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            text-shadow: 0 1px 2px black;
        }

        /* 背包面板 */
        .inventory-bar {
            background: #0b0d16cc;
            border-radius: 28px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #cab8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            backdrop-filter: blur(8px);
            border: 0.5px solid #4a3a66;
        }

        .inv-item {
            background: #1e1930;
            padding: 4px 12px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 12px;
        }

        .clue-card {
            background: #19152b;
            border-left: 4px solid #d67eb8;
            padding: 12px 16px;
            margin: 18px 0 12px 0;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #ecd9ff;
        }

        .options-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .option-btn {
            background: rgba(28, 30, 48, 0.96);
            border: 1px solid #7a60a2;
            border-radius: 60px;
            padding: 14px 20px;
            color: #f3ecfe;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            transition: 0.08s linear;
            cursor: pointer;
            font-family: inherit;
        }

        .option-btn:active {
            background: #362c55;
            transform: scale(0.97);
            border-color: #b77de0;
        }

        .puzzle-panel {
            background: #0a0920cc;
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 18px;
            margin: 16px 0 12px;
            border: 1px solid #6a4c92;
        }

        .puzzle-input-group {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .puzzle-input-group input {
            background: #000000bb;
            border: 1px solid #b28bdf;
            padding: 12px 16px;
            border-radius: 44px;
            color: white;
            font-size: 22px;
            text-align: center;
            width: 160px;
            font-family: monospace;
            letter-spacing: 3px;
        }

        .puzzle-submit {
            background: #6b4790;
            border: none;
            padding: 12px 24px;
            border-radius: 44px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .bottom-bar {
            background: #0a0c14cc;
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            border-top: 0.5px solid #342f48;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #cdbef5;
            font-size: 17px;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
        }

        .icon-btn:active {
            background: #26213f;
        }

        .ending-tag {
            text-align: center;
            margin-top: 18px;
            padding: 12px;
            background: #00000066;
            border-radius: 40px;
            color: #ffcd94;
            font-weight: bold;
        }

        .screen::-webkit-scrollbar {
            width: 4px;
        }
        .screen::-webkit-scrollbar-track {
            background: #1e1a2e;
        }
        .screen::-webkit-scrollbar-thumb {
            background: #a07fd1;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="phone" id="gamePhone">
    <div class="status-bar">
        <span id="liveTime">23:47</span>
        <span>📶 ███ 71%</span>
    </div>
    <div class="screen" id="gameScreen">
        <div id="inventoryPanel" class="inventory-bar">🎒 道具: 无</div>
        <div class="story-card">
            <div class="story-text" id="storyText">加载观测记录...</div>
            <div id="extraClueArea"></div>
            <div class="options-area" id="optionsContainer"></div>
        </div>
    </div>
    <div class="bottom-bar">
        <button class="icon-btn" id="resetBtn">⟳ 重启</button>
        <button class="icon-btn" id="soundToggleBtn">🎧 氛围音</button>
        <span style="font-size:11px; color:#8f7dbb;">[ 观测者协议 ]</span>
    </div>
</div>

<script>
    // =============== 音频引擎 (轻量) ===============
    let audioCtx = null;
    let bgGain = null;
    let noiseNode = null;
    let lfo = null;
    let audioAllowed = false;
    let isSoundOn = false;     // 用户是否开启背景音效

    function initAudio() {
        if (audioCtx) return audioCtx;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            bgGain = audioCtx.createGain();
            bgGain.gain.value = 0;
            bgGain.connect(audioCtx.destination);
            return audioCtx;
        } catch(e) { return null; }
    }

    function startAmbient() {
        if (!audioCtx || !isSoundOn || noiseNode) return;
        const bufferSize = 4096;
        const scriptNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
        scriptNode.onaudioprocess = (e) => {
            const out = e.outputBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) out[i] = (Math.random() * 2 - 1) * 0.2;
        };
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 350;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.14;
        scriptNode.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(bgGain);
        noiseNode = scriptNode;

        const lowOsc = audioCtx.createOscillator();
        lowOsc.type = "sine";
        lowOsc.frequency.value = 0.95;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 0.045;
        lowOsc.connect(lfoGain);
        lfoGain.connect(bgGain);
        lowOsc.start();
        lfo = lowOsc;
        bgGain.gain.setTargetAtTime(0.26, audioCtx.currentTime, 0.7);
    }

    function stopAmbient() {
        if (bgGain) bgGain.gain.value = 0;
        if (noiseNode) { try { noiseNode.disconnect(); } catch(e){} noiseNode = null; }
        if (lfo) { try { lfo.stop(); } catch(e){} lfo = null; }
    }

    function playTap() {
        if (!audioCtx || !isSoundOn || !audioAllowed) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 980;
        gain.gain.value = 0.08;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
        osc.stop(audioCtx.currentTime + 0.25);
    }

    function playDread() {
        if (!audioCtx || !isSoundOn || !audioAllowed) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = 280;
        gain.gain.value = 0.15;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
        osc.stop(audioCtx.currentTime + 1.0);
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = "sawtooth";
        osc2.frequency.value = 490;
        gain2.gain.value = 0.09;
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start();
        osc2.stop(audioCtx.currentTime + 0.8);
    }

    function enableAudioByGesture() {
        if (audioAllowed) return;
        const ctx = initAudio();
        if (ctx && ctx.state === "suspended") {
            ctx.resume().then(() => {
                audioAllowed = true;
                if (isSoundOn) startAmbient();
                updateSoundUI();
            }).catch(e=>{});
        } else if (ctx) {
            audioAllowed = true;
            if (isSoundOn) startAmbient();
            updateSoundUI();
        }
    }

    function toggleSound() {
        if (!audioAllowed) {
            enableAudioByGesture();
            setTimeout(() => {
                if (audioAllowed) {
                    isSoundOn = true;
                    startAmbient();
                    updateSoundUI();
                }
            }, 50);
            return;
        }
        isSoundOn = !isSoundOn;
        if (isSoundOn) startAmbient();
        else stopAmbient();
        updateSoundUI();
        if (isSoundOn) playTap();
    }

    function updateSoundUI() {
        const btn = document.getElementById("soundToggleBtn");
        if (btn) {
            if (isSoundOn && audioAllowed) btn.innerText = "🎧 氛围音开";
            else if (!isSoundOn) btn.innerText = "🔇 氛围音关";
            else btn.innerText = "🎵 点我启用";
        }
    }

    // =============== 游戏核心 (长线 + 道具 + 多谜题) ===============
    // 可用道具: 旧照片, 半张病历, 镇静剂, 院长的钥匙, 怀表, 日记残页
    let inventory = [];   // 字符串数组
    let currentScene = "intro";
    let extraFlags = {
        doorUnlocked: false,   // 院长办公室门锁
        cabinetCodeFound: false,
        hasInjected: false     // 剧情flag
    };
    
    // 辅助函数: 更新背包UI
    function updateInventoryUI() {
        const panel = document.getElementById("inventoryPanel");
        if (panel) {
            if (inventory.length === 0) panel.innerHTML = "🎒 道具: 无";
            else panel.innerHTML = "🎒 道具: " + inventory.map(i => `📦 ${i}`).join(' · ');
        }
    }
    
    function addItem(item) {
        if (!inventory.includes(item)) inventory.push(item);
        updateInventoryUI();
    }
    
    function hasItem(item) {
        return inventory.includes(item);
    }
    
    function removeItem(item) {
        inventory = inventory.filter(i => i !== item);
        updateInventoryUI();
    }
    
    // 场景库 (更复杂 + 多分支)
    const scenes = {
        intro: {
            desc: "📱 老旧手机在午夜闪烁，未知短信:「废弃的『慈恩疗养院』B6层，她还在等你。观测已经开始，别迷失在镜像里。」\n手机内只有一个诡异应用「深渊回声」。",
            options: [
                { text: "🔍 打开应用", next: "lobby", act: () => playTap() },
                { text: "❌ 试图删除应用", next: "bad_ignore", act: () => playDread() }
            ]
        },
        lobby: {
            desc: "🏚️ 疗养院大厅，弥漫消毒水与霉味。电梯面板只有B1~B5，墙壁血字：「B6需要权限」。前台有护士站和院长办公室方向。",
            options: [
                { text: "🚪 前往护士站", next: "nurseStation", act: () => playTap() },
                { text: "📂 探索院长办公室（需要钥匙）", next: "directorOffice", act: () => playTap() },
                { text: "🛗 强行电梯尝试B6", next: "bad_elevator", act: () => playDread() }
            ]
        },
        nurseStation: {
            desc: "💊 护士站一片狼藉，抽屉里找到半张病历和一张褪色照片。病历写着「林薇，病患编码 0942，特殊隔离室B6」。照片背后数字: 7294。",
            options: [
                { text: "📸 拿走照片和病历", next: "lobby", act: () => { addItem("旧照片"); addItem("半张病历"); playTap(); } },
                { text: "🔎 仔细检查柜台", next: "nurseStation", act: () => playTap() }
            ],
            extra: "<div class='clue-card'>📄 病历编码 0942 可能关联某个密码。照片后7294？</div>"
        },
        directorOffice: {
            desc: "🚪 院长办公室门紧锁，需要6位数字密码。旁边挂着一幅油画，画框背面有细小的字：「她入院的日子 —— 1994年7月29日。」",
            options: [
                { text: "🔢 输入密码锁", next: "directorLock", act: () => playTap() },
                { text: "⬅️ 返回大厅", next: "lobby", act: () => playTap() }
            ]
        },
        directorLock: {
            desc: "⌨️ 密码锁发光，提示: 「六位数字，那一天的日月年组合 (DDMMYY)」。你回想起油画背后的日期。",
            isPuzzle: true,
            options: [{ text: "⬅️ 返回办公室门口", next: "directorOffice", act: () => playTap() }]
        },
        directorSuccess: {
            desc: "🔓 密码正确！办公室内找到『院长的钥匙』，一本实验笔记提到：「B6层需要特殊镇静剂，否则观测者会产生幻觉。镇静剂在药房保险箱，密码是病历号后四位+逆向。」",
            options: [
                { text: "🔑 拿走钥匙，前往药房", next: "pharmacy", act: () => { addItem("院长的钥匙"); playTap(); } },
                { text: "📖 阅读更多笔记", next: "directorSuccess", act: () => playTap() }
            ]
        },
        pharmacy: {
            desc: "💉 药房上锁保险箱，需要4位数字。你记得病历号0942，笔记提示「后四位+逆向」—— 即 0942 逆向是 2490？还是相加？需推理。",
            options: [
                { text: "🔢 输入保险箱密码", next: "pharmacyPuzzle", act: () => playTap() },
                { text: "🔙 返回大厅", next: "lobby", act: () => playTap() }
            ],
            extra: "<div class='clue-card'>💊 病历号0942，逆向可能是 2490 ，试试看。</div>"
        },
        pharmacyPuzzle: {
            desc: "🔐 保险箱面板: '输入4位数字 (病历后四位与镜像结合)'",
            isPuzzle: true,
            options: [{ text: "⬅️ 放弃", next: "pharmacy", act: () => playTap() }]
        },
        pharmacyGot: {
            desc: "✅ 保险箱开启，获得镇静剂！同时找到一张旧报纸剪报: 「1994.7.29 慈恩疗养院失踪案」提及镜子实验。",
            options: [
                { text: "💉 带着镇静剂返回大厅", next: "lobby", act: () => { addItem("镇静剂"); playTap(); } }
            ]
        },
        // 使用钥匙进入B6电梯前准备
        elevatorB6: {
            desc: "🛗 你用院长的钥匙激活电梯隐藏按钮，来到B6层。走廊两侧都是镜子，地板偶尔映出扭曲人脸。尽头有隔离室和档案室。",
            options: [
                { text: "🚪 进入隔离室 (需要镇静剂抵御幻觉)", next: "isolationRoom", act: () => playTap() },
                { text: "📁 先去档案室", next: "archiveRoom", act: () => playTap() }
            ]
        },
        isolationRoom: {
            desc: "🧪 隔离室充满雾气，墙上刻满数字。中央病床上有一本日记，但你开始出现幻觉，必须使用镇静剂才能清醒翻阅。",
            options: (hasItem("镇静剂") ? [
                { text: "💊 使用镇静剂，阅读日记", next: "readDiary", act: () => { removeItem("镇静剂"); playTap(); } },
                { text: "😰 强行阅读 (风险)", next: "bad_hallucinate", act: () => playDread() }
            ] : [
                { text: "😵 没有镇静剂，意识模糊", next: "bad_hallucinate", act: () => playDread() }
            ])
        },
        readDiary: {
            desc: "📔 日记最后一页：'她困在镜像仪式中，需要集齐三样信物: 旧照片、怀表、日记残页。怀表在院长保险柜里，密码是7294（照片后数字）。' 并且提到最终仪式间在地下层镜像回廊。",
            options: [
                { text: "⏱️ 返回院长办公室，开保险柜", next: "safeBox", act: () => playTap() },
                { text: "📜 前往档案室找日记残页", next: "archiveRoom", act: () => playTap() }
            ]
        },
        safeBox: {
            desc: "🔐 院长办公室内侧保险柜，输入4位数字 (照片后7294)。",
            isPuzzle: true,
            options: [{ text: "🔙 返回", next: "directorSuccess", act: () => playTap() }]
        },
        safeGot: {
            desc: "⌛ 保险柜打开，获得古董怀表！指针停在2:08，背面刻着「观测时刻」。",
            options: [
                { text: "🧳 带着怀表继续探索", next: "lobby", act: () => { addItem("怀表"); playTap(); } }
            ]
        },
        archiveRoom: {
            desc: "📚 档案室架子上落满灰尘，找到一本残破日志「林薇的治疗记录」，最后一页被撕走。但你在墙角发现另一本日记残页，记载仪式需要将三样信物放在镜像祭坛。",
            options: [
                { text: "📜 取得日记残页", next: "lobby", act: () => { addItem("日记残页"); playTap(); } },
                { text: "🔍 搜寻其他线索", next: "archiveRoom", act: () => playTap() }
            ]
        },
        // 最终区域: 镜像回廊
        mirrorCorridor: {
            desc: "🪞 通过B6深处的密道，来到镜像回廊。四面都是镜子，需要三样信物才能进行仪式 (旧照片、怀表、日记残页)。",
            options: (hasItem("旧照片") && hasItem("怀表") && hasItem("日记残页")) ? [
                { text: "🕯️ 放置信物，举行仪式", next: "ritualStart", act: () => playTap() },
                { text: "🔙 暂时离开", next: "elevatorB6", act: () => playTap() }
            ] : [
                { text: "🔙 缺少信物，无法继续", next: "elevatorB6", act: () => playTap() }
            ]
        },
        ritualStart: {
            desc: "✨ 三样信物燃起幽蓝火焰，镜子中出现林薇的残影。她低语：“你需要选择: 解放我，还是取代我？” 背后浮现两个选项。",
            options: [
                { text: "🕊️ 解放她 · 打破镜子诅咒", next: "trueEnding", act: () => playTap() },
                { text: "🌑 取代她 · 成为新的观测者", next: "darkEnding", act: () => playDread() }
            ]
        },
        trueEnding: {
            desc: "🌟 镜子碎裂，白光笼罩。你回到现实，手机中所有诡异数据消失。窗外清晨阳光洒入，但你手腕残留一道银痕。你永远记得那个名字——林薇，她终于安息。\n\n【真结局 · 破镜救赎】",
            options: [{ text: "🏁 结束旅程 (重启)", next: "resetGame", act: () => playTap() }],
            isEnding: true
        },
        darkEnding: {
            desc: "🖤 你踏入镜中，取代她成为永恒观测者。疗养院B6层多了一个徘徊的影子，手机APP永远显示「观测中」……\n\n【结局 · 深渊继承者】",
            options: [{ text: "💀 重启轮回", next: "resetGame", act: () => playDread() }],
            isEnding: true
        },
        // 坏结局们
        bad_ignore: { desc: "📴 手机屏幕渗出黑水，房间温度骤降。你再也没有醒来。", options: [{ text: "⚠️ 重启", next: "resetGame", act: () => playDread() }], isEnding: true },
        bad_elevator: { desc: "🛗 电梯失控坠落，黑暗中没有尽头。", options: [{ text: "🔄 重来", next: "resetGame", act: () => playDread() }], isEnding: true },
        bad_hallucinate: { desc: "🌀 没有镇静剂，你陷入疯狂，永远迷失在镜像走廊。", options: [{ text: "😵 重启", next: "resetGame", act: () => playDread() }], isEnding: true },
        resetGame: { desc: "🔄 观测重启，记忆模糊。你再次拿起那部手机……", options: [{ text: "✨ 重新开始", next: "intro", act: () => { resetGameState(); playTap(); } }] }
    };
    
    // 密码逻辑 + 渲染
    function checkDirectorPassword(input) {
        // 日期1994年7月29日 -> 290794 (DDMMYY) 或 290794? 按照提示DDMMYY => 29/07/94 => 290794
        return input === "290794";
    }
    
    function checkPharmacyCode(input) {
        // 0942 逆向 2490 
        return input === "2490";
    }
    
    function checkSafeCode(input) {
        return input === "7294";
    }
    
    function renderScene(sceneId) {
        const scene = scenes[sceneId];
        if (!scene) { renderScene("intro"); return; }
        document.getElementById("storyText").innerHTML = scene.desc.replace(/\n/g, '<br>');
        const extraDiv = document.getElementById("extraClueArea");
        extraDiv.innerHTML = scene.extra || "";
        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";
        
        // 特殊谜题渲染
        if (sceneId === "directorLock") {
            extraDiv.innerHTML += `<div class="puzzle-panel"><div class="puzzle-input-group"><input type="text" id="pwdDir" placeholder="6位数字" maxlength="6"><button class="puzzle-submit" id="submitDir">验证</button></div><div class="clue-card">🔑 提示: 油画背面日期 DDMMYY 格式 (例如 290794)</div></div>`;
            document.getElementById("submitDir")?.addEventListener("click", () => {
                const val = document.getElementById("pwdDir").value.trim();
                if (checkDirectorPassword(val)) {
                    renderScene("directorSuccess");
                } else { playDread(); alert("密码错误！门纹丝不动。"); }
            });
        }
        else if (sceneId === "pharmacyPuzzle") {
            extraDiv.innerHTML += `<div class="puzzle-panel"><div class="puzzle-input-group"><input type="text" id="pwdPharm" placeholder="4位数字" maxlength="4"><button class="puzzle-submit" id="submitPharm">开启</button></div><div class="clue-card">💊 病历0942 + 笔记「后四位+逆向」→ 试试 2490</div></div>`;
            document.getElementById("submitPharm")?.addEventListener("click", () => {
                const val = document.getElementById("pwdPharm").value.trim();
                if (checkPharmacyCode(val)) {
                    renderScene("pharmacyGot");
                } else { playDread(); alert("保险箱无法打开！"); }
            });
        }
        else if (sceneId === "safeBox") {
            extraDiv.innerHTML += `<div class="puzzle-panel"><div class="puzzle-input-group"><input type="text" id="pwdSafe" placeholder="4位数字" maxlength="4"><button class="puzzle-submit" id="submitSafe">开启</button></div><div class="clue-card">⌛ 照片背后数字 7294</div></div>`;
            document.getElementById("submitSafe")?.addEventListener("click", () => {
                const val = document.getElementById("pwdSafe").value.trim();
                if (checkSafeCode(val)) {
                    renderScene("safeGot");
                } else { playDread(); alert("保险柜无法打开!"); }
            });
        }
        
        // 普通选项
        if (scene.options) {
            for (let opt of scene.options) {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt.text;
                btn.onclick = () => {
                    if (opt.act) opt.act();
                    let next = opt.next;
                    if (next === "resetGame") resetGameState();
                    renderScene(next);
                    const scr = document.getElementById("gameScreen");
                    setTimeout(() => scr.scrollTop = scr.scrollHeight, 20);
                };
                optionsDiv.appendChild(btn);
            }
        }
        if (scene.isEnding) {
            const endDiv = document.createElement("div");
            endDiv.className = "ending-tag";
            endDiv.innerText = "✧ 结局达成 · 观测终止 ✧";
            optionsDiv.appendChild(endDiv);
        }
        updateInventoryUI();
    }
    
    function resetGameState() {
        inventory = [];
        extraFlags = { doorUnlocked: false, cabinetCodeFound: false, hasInjected: false };
        updateInventoryUI();
        currentScene = "intro";
    }
    
    // 绑定全局事件
    document.getElementById("resetBtn").addEventListener("click", () => {
        resetGameState();
        renderScene("intro");
        playTap();
    });
    document.getElementById("soundToggleBtn").addEventListener("click", toggleSound);
    const container = document.getElementById("gamePhone");
    container.addEventListener("touchstart", () => { if (!audioAllowed) enableAudioByGesture(); }, { passive: true });
    container.addEventListener("click", () => { if (!audioAllowed) enableAudioByGesture(); });
    
    function updateClock() {
        const d = new Date();
        const timeStr = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        document.getElementById("liveTime").innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();
    renderScene("intro");
    console.log("%c⚠️ 观测者密文: 院长室密码 290794 | 药房密码 2490 | 保险柜 7294", "color:#cb9eff");
</script>
</body>
</html>
